# Each entry configures one independently scheduled instance of the
# mongo_catalog_sync Spark app (airflow/dags/mongo_catalog_sync.py).
# Add or remove entries to add/remove scheduled sync jobs; no code changes
# needed. Required keys: name, mongo_database, mongo_collection,
# catalog_database, catalog_table, schedule. Optional keys: mongo_uri
# (defaults to mongodb://mongo:27017 or $MONGO_URI), batch_limit, dry_run,
# partition_timestamp_column (derive year/month and partition by both),
# upsert_key (additive hash-based merge on this column; nothing is deleted
# from MongoDB or the target), hash_exclude_columns (ignored in the hash) and
# json_columns (stored as JSON strings, for free-form maps) and delete_synced
# (with upsert_key: delete source documents after they are merged).
jobs:
  - name: crawler_articles
    mongo_uri: mongodb://mongodb:27017
    mongo_database: Crawler
    mongo_collection: crawler_responses_datalake
    catalog_database: crawler
    catalog_table: responses_b0
    schedule: "@hourly"
  - name: stock_data
    mongo_uri: mongodb://mongodb:27017
    mongo_database: Crawler
    mongo_collection: stockdata
    catalog_database: crawler
    catalog_table: stock_data
    partition_timestamp_column: Timestamp
    schedule: "@hourly"
  - name: instruments
    mongo_uri: mongodb://mongodb:27017
    mongo_database: Crawler
    mongo_collection: instruments
    catalog_database: crawler
    catalog_table: instruments
    upsert_key: Code
    hash_exclude_columns: [LastCrawled, Created, Updated]
    json_columns: [Unmapped]
    schedule: "@hourly"
  - name: shab_publications
    mongo_uri: mongodb://mongodb:27017
    mongo_database: Crawler
    mongo_collection: shab_publications
    catalog_database: crawler
    catalog_table: shab_publications
    upsert_key: _id
    hash_exclude_columns: [Timestamp, Created, Updated]
    delete_synced: true
    schedule: "@hourly"
