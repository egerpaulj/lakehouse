# Each entry configures a bronze -> silver pipeline generated by
# airflow/dags/responses_s0_pipeline.py. Every entry produces four independent
# DAGs, so each can be scheduled, paused, triggered and retried on its own:
#
#   responses_s0_<name>_cdf        CDF stream source_table -> target_table
#   responses_s0_<name>_summary    llm-summary                -> summary
#   responses_s0_<name>_ner_nel    llm-ner-nel                -> ner_nel
#   responses_s0_<name>_embedding  embedding API (BGE-M3)     -> text_embedding_dense|_sparse,
#                                  summary_embedding_dense (when a summary exists)
#
# Common keys: name, source_table, target_table, checkpoint_location,
# text_column, merge_key.
# Configure only the jobs required for a pipeline. Per-job keys (cdf, summary,
# ner_nel, embedding): schedule, paused (default false), limit (rows per run),
# and model/strategy/ollama_host (summary, ner_nel; defaults
# http://ollama-summary:11434 and http://ollama-ner:11434) or api_url (embedding).
pipelines:
  - name: crawler_responses
    source_table: crawler.responses_b0
    target_table: crawler.responses_s0
    checkpoint_location: s3a://warehouse/checkpoints/crawler_responses_s0
    text_column: text
    merge_key: _id
    cdf:
      schedule: "@hourly"
    summary:
      schedule: "@hourly"
      limit: 50
      model: rnj-1:latest
      strategy: ollama
      ollama_host: http://ollama-summary:11434
    ner_nel:
      schedule: "@hourly"
      limit: 50
      model: qwen3:14b
      strategy: ollama
      ollama_host: http://ollama-ner:11434
    embedding:
      schedule: "@hourly"
      limit: 200
      api_url: http://embedding-api:8000
  - name: books
    source_table: crawler.books_b0
    target_table: crawler.books_s0
    checkpoint_location: s3a://warehouse/checkpoints/crawler_books_s0
    text_column: text
    merge_key: chapter_id
    cdf:
      schedule: "@hourly"
    ner_nel:
      schedule: "@hourly"
      limit: 50
      model: qwen3:14b
      strategy: ollama
      ollama_host: http://ollama-ner:11434
    embedding:
      schedule: "@hourly"
      limit: 200
      api_url: http://embedding-api:8000
  - name: documents
    source_table: crawler.documents_b0
    target_table: crawler.documents_s0
    checkpoint_location: s3a://warehouse/checkpoints/crawler_documents_s0
    text_column: text
    merge_key: document_id
    cdf:
      schedule: "@hourly"
    ner_nel:
      schedule: "@hourly"
      limit: 50
      model: qwen3:14b
      strategy: ollama
      ollama_host: http://ollama-ner:11434
    embedding:
      schedule: "@hourly"
      limit: 200
      api_url: http://embedding-api:8000
