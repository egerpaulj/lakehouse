apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Hive Metastore
    uid: hive-metastore
    type: postgres
    access: proxy
    url: postgres:5432
    user: ${POSTGRES_USER}
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
    jsonData:
      database: hive
      sslmode: disable
  - name: Trino
    uid: trino
    type: trino-datasource
    access: proxy
    url: http://trino:8080
    jsonData:
      catalog: lakehouse
      schema: catalog_examples
